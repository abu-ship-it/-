<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flex 布局练习（学生版）· 移动端课程页</title>
<style>
  /* ========== 基础样式：已给出，请勿修改 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eceef2; color: #1f2328; line-height: 1.5;
    display: flex; justify-content: center;
    padding: 16px;
  }
  .wrap { 
  width: 100%;
  max-width: 420px;
  background-color: pink
  }

  .phone { background: #fff; border-radius: 18px; overflow: hidden; }

  .app-bar { padding: 14px 16px; background: #2563eb; color: #fff; }
  .app-bar h1 { font-size: 16px; font-weight: 500; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.28); font-size: 13px;
    display: flex; 
    align-items: center; 
    justify-content: center;
  }

  .section { padding: 16px; }
  .section-title { font-size: 13px; color: #6b7280; margin-bottom: 10px; }

  .stat { background: #f3f4f6; border-radius: 12px; padding: 14px 8px; }
  .stat .num { font-size: 20px; font-weight: 500; color: #2563eb; }
  .stat .label { font-size: 12px; color: #6b7280; }

  .lesson { background: #f9fafb; border: 1px solid #eceef2; border-radius: 12px; padding: 12px; }
  .lesson-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: #dbeafe; color: #1d4ed8; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-info .name { font-size: 14px; }
  .lesson-info .teacher { font-size: 12px; color: #6b7280; }
  .lesson-time { font-size: 12px; color: #9ca3af; }

  .tabbar { border-top: 1px solid #eceef2; padding: 10px 0; background: #fff; }
  .tab .ico { width: 22px; height: 22px; border-radius: 6px; background: #eceef2; }
  .tab .txt { font-size: 11px; color: #6b7280; }
  .tab.active .ico { background: #2563eb; }
  .tab.active .txt { color: #2563eb; }













  /* ========== 作答区：只改下面带 TODO 的 6 处 ========== */

  /* TODO 1 顶栏：标题在左、头像在右，两者垂直居中 */
  .app-bar { /* 设置顶栏容器的布局样式 */
    display: flex; /* 使用 Flex 布局排列标题和头像 */
    justify-content: space-between; /* 标题靠左、头像靠右 */
    align-items: center; /* 让标题和头像垂直居中对齐 */
   } /* 结束顶栏样式 */

  /* TODO 2 三张统计卡横向排成一行，卡片之间留 10px 间距 */
  .stats { /* 设置统计卡容器的布局样式 */
   display:flex; /* 让统计卡横向排列 */
   gap:10px; /* 设置统计卡之间的间距 */
   } /* 结束统计区样式 */

  /* TODO 3 每张统计卡：内部「数字」在上、「文字」在下，都水平居中，间距 4px */
  .stat { /* 设置统计卡内部的布局样式 */
    display:flex; /* 使用 Flex 布局排列数字和文字 */
    flex-direction:column; /* 让数字和文字纵向排列 */
    align-items:center; /* 让数字和文字水平居中 */
    gap:4px; /* 设置数字和文字之间的间距 */
   } /* 结束统计卡内部样式 */

  /* TODO 4 统计卡本身要三者等宽，平分一整行 */
  .stat { /* 设置统计卡在统计区中的宽度 */
    flex:1; /* 让每张统计卡平分可用空间 */
  } /* 结束统计卡宽度样式 */

  /* TODO 5 课程列表：纵向排列，卡片之间间距 10px */
  .lesson-list { /* 设置课程列表容器的布局样式 */
    display:flex; /* 使用 Flex 布局排列课程卡片 */
    flex-direction:column; /* 让课程卡片纵向排列 */
    gap:10px; /* 设置课程卡片之间的间距 */
  } /* 结束课程列表样式 */

  /* TODO 6 单个课程卡片：图标 + 文字 + 时间 横向排列并垂直居中，间距 12px；
            中间文字区域占满剩余宽度，且加 min-width:0 防止撑破 */
  .lesson { /* 设置单个课程卡片的布局样式 */
    display:flex; /* 让图标、文字和时间横向排列 */
    align-items:center; /* 让图标、文字和时间垂直居中 */
    gap:12px; /* 设置卡片内容之间的间距 */
   } /* 结束课程卡片样式 */
  .lesson-info { /* 设置课程文字区域的布局样式 */
    flex:1; /* 让文字区域占满剩余空间 */
    min-width:0; /* 允许文字区域缩小，避免撑宽卡片 */
   } /* 结束课程文字区域样式 */

  /* TODO 7 底部导航：4 个 tab 横向等分；每个 tab 内部「图标在上、文字在下」居中 */
  .tabbar { /* 设置底部导航容器的布局样式 */
    display: flex; /* 让四个导航项横向排列 */

   } /* 结束底部导航容器样式 */
  .tab { /* 设置每个底部导航项的样式 */
    flex:1; /* 让四个导航项等分宽度 */
    display:flex; /* 使用 Flex 布局排列图标和文字 */
    flex-direction:column; /* 让图标在上、文字在下 */
    align-items:center; /* 让图标和文字水平居中 */
    gap:6px; /* 设置图标和文字之间的间距 */
  } /* 结束导航项样式 */












  






</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="app-bar">
      <h1>我的课程</h1>
      <div class="avatar">李</div>
    </div>

    <div class="section">
      <p class="section-title">本周概览</p>
      <div class="stats">
        <div class="stat"><span class="num">6</span><span class="label">已修学分</span></div>
        <div class="stat"><span class="num">3</span><span class="label">待交作业</span></div>
        <div class="stat"><span class="num">92%</span><span class="label">出勤率</span></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">今日课程</p>
      <div class="lesson-list">
        <div class="lesson">
          <div class="lesson-icon">网</div>
          <div class="lesson-info">
            <p class="name">网页设计与制作</p>
            <p class="teacher">王敏 · A302</p>
          </div>
          <span class="lesson-time">08:00</span>
        </div>
        <div class="lesson">
          <div class="lesson-icon">数</div>
          <div class="lesson-info">
            <p class="name">数据库原理</p>
            <p class="teacher">张伟 · B105</p>
          </div>
          <span class="lesson-time">10:10</span>
        </div>
        <div class="lesson">
          <div class="lesson-icon">程</div>
          <div class="lesson-info">
            <p class="name">程序设计基础</p>
            <p class="teacher">陈静 · A208</p>
          </div>
          <span class="lesson-time">14:00</span>
        </div>
        <div class="lesson">
          <div class="lesson-icon">英</div>
          <div class="lesson-info">
            <p class="name">专业英语</p>
            <p class="teacher">刘洋 · C401</p>
          </div>
          <span class="lesson-time">16:20</span>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab active"><div class="ico"></div><span class="txt">课程</span></div>
      <div class="tab"><div class="ico"></div><span class="txt">作业</span></div>
      <div class="tab"><div class="ico"></div><span class="txt">成绩</span></div>
      <div class="tab"><div class="ico"></div><span class="txt">我的</span></div>
    </div>
  </div>

</div>
</body>
</html>
